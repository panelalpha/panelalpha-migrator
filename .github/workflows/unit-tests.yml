name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: PHP 8.3 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: composer test -- --coverage-text --only-summary-for-coverage-text
